[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acc-rmc-ai-platform"
version = "0.1.0"
description = "Enterprise Ready-Mix Concrete Quality Intelligence, Digital Twin & Mix Optimization Platform"
authors = [{ name = "ACC RMC AI Team" }]
requires-python = ">=3.12"
readme = "README.md"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ==============================================================================
# RUFF LINTER & CODE INSPECTOR CONFIGURATION
# ==============================================================================
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "runtime",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # Line length handled by black formatter
    "B008", # Function call in argument default (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
combine-as-imports = true
lines-after-imports = 2

# ==============================================================================
# BLACK CODE FORMATTER CONFIGURATION
# ==============================================================================
[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | __pycache__
  | build
  | dist
  | runtime
)/
'''

# ==============================================================================
# ISORT IMPORT SORTING CONFIGURATION
# ==============================================================================
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
known_first_party = ["src"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

# ==============================================================================
# MYPY STRICT TYPE CHECKER CONFIGURATION
# ==============================================================================
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
implicit_reexport = false
mypy_path = "."
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["openpyxl.*", "structlog.*", "pydantic.*"]
ignore_missing_imports = true

# ==============================================================================
# PYTEST HARNESS CONFIGURATION
# ==============================================================================
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
